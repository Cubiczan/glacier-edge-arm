name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release -p gea-cli
      - run: cargo run -p gea-cli -- evaluate --windows-per-scenario 20
      - run: cargo run -p gea-cli -- demo --scenario thermal_runaway
