[workspace]
members = [
    "crates/gea-core",
    "crates/gea-telemetry",
    "crates/gea-inference",
    "crates/gea-governance",
    "crates/gea-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["cubiczan <cubiczan@noreply.codeberg.org>"]
license = "MIT"
repository = "https://codeberg.org/cubiczan/glacier-edge-arm"
description = "Arm-optimized edge inference for data center BESS fault detection"

[workspace.dependencies]
gea-core = { path = "crates/gea-core" }
gea-telemetry = { path = "crates/gea-telemetry" }
gea-inference = { path = "crates/gea-inference" }
gea-governance = { path = "crates/gea-governance" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.19", features = ["v4", "serde"] }
